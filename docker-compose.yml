services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: eds
      POSTGRES_PASSWORD: eds
      POSTGRES_DB: eds
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eds -d eds"]
      interval: 3s
      timeout: 3s
      retries: 20

  etl:
    build: .
    command: python -m etl.run
    environment:
      EDS_DATABASE_URL: postgresql+psycopg2://eds:eds@db:5432/eds
    volumes: ["./data:/app/data", "./config:/app/config"]
    depends_on:
      db: {condition: service_healthy}

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    environment:
      DASHBOARD_DATABASE_URL: postgresql+psycopg2://analyst:analyst@db:5432/eds
    ports: ["8501:8501"]
    depends_on:
      etl: {condition: service_completed_successfully}

volumes:
  pgdata:
