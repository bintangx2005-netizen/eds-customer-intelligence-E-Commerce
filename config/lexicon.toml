  "pessim*", "horrivel*", "ruim", "nao recebi", "nao chegou", "nunca chegou", "ainda nao",
  "atras*", "demor*", "defeito*", "quebrad*", "errad*", "diferente*", "falsific*", "devol*",
  "reembols*", "decepcion*", "decepcao", "pior", "lamentavel", "fraude", "engan*", "absurd*",
