# Leksikon kata kunci Bahasa Portugis (tanpa aksen, huruf kecil) untuk analisis teks ulasan.
# Kata berakhiran * dicocokkan sebagai awalan kata; selain itu dicocokkan sebagai kata utuh/frasa.
# Daftar ini dimiliki "data owner ulasan" (pemimpin pengalaman pelanggan) dan dapat diubah di sini.

[sentiment]
positive = [
  "otimo*", "excelente*", "bom", "boa", "recomend*", "perfeit*", "adorei", "amei", "satisfeit*",
  "rapid*", "maravilh*", "parabens", "gostei", "superou", "chegou antes", "tudo certo", "nota 10",
  "sensacional", "lindo*", "bonito*", "eficiente", "pontual",
]
